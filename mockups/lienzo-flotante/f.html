<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:
 radial-gradient(70% 55% at 30% 25%,rgba(255,236,200,.55),transparent 60%),
 linear-gradient(180deg,#ece6dc 0%,#e3dbcf 100%);perspective:2200px;position:relative}
body:after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 20% 30%,rgba(0,0,0,.012) 0 1px,transparent 1px 3px);pointer-events:none}
.sun{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,210,.35) 38%,transparent 46%,transparent 52%,rgba(255,240,210,.28) 58%,transparent 66%);pointer-events:none;z-index:5;mix-blend-mode:soft-light}
.wrap{position:absolute;left:50%;top:50%;width:640px;height:820px;margin:-430px 0 0 -320px;transform-style:preserve-3d;transform:rotateY(ROTdeg) rotateX(2deg)}
.shadow{position:absolute;left:40px;top:60px;width:640px;height:820px;background:rgba(40,30,20,.35);filter:blur(38px);transform:translateZ(-60px)}
/* frame: front face ring + sides */
.fr{position:absolute;inset:0;transform-style:preserve-3d}
.ring{position:absolute;inset:0;transform:translateZ(50px);border:22px solid #141414;background:transparent;box-shadow:inset 0 0 0 1px #2a2a2a}
.ring:before{content:"";position:absolute;inset:-22px;border:1px solid rgba(255,255,255,.08);pointer-events:none}
.side{position:absolute;background:linear-gradient(90deg,#0b0b0b,#1c1c1c)}
.sR{top:0;right:0;width:50px;height:100%;transform-origin:right;transform:rotateY(90deg)}
.sL{top:0;left:0;width:50px;height:100%;transform-origin:left;transform:rotateY(-90deg)}
.sT{left:0;top:0;width:100%;height:50px;transform-origin:top;transform:rotateX(90deg)}
.sB{left:0;bottom:0;width:100%;height:50px;transform-origin:bottom;transform:rotateX(-90deg)}
.back{position:absolute;inset:0;background:#050505;transform:translateZ(1px)}
/* canvas floating inside with gap */
.cv{position:absolute;left:42px;top:42px;right:42px;bottom:42px;transform-style:preserve-3d}
.face{position:absolute;inset:0;transform:translateZ(44px);background:#fbfaf7 url(art.jpg) center/88% auto no-repeat;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.face:after{content:"";position:absolute;inset:0;background:
 repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),
 repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px),
 linear-gradient(115deg,rgba(255,250,235,.25),transparent 45%,rgba(0,0,0,.05))}
.cs{position:absolute;background:#f3f1ec}
.cR{top:0;right:0;width:40px;height:100%;transform-origin:right;transform:translateZ(4px) rotateY(90deg);background:linear-gradient(90deg,#d9d6cf,#efece6)}
.cL{top:0;left:0;width:40px;height:100%;transform-origin:left;transform:translateZ(4px) rotateY(-90deg);background:#e9e6e0}
.cT{left:0;top:0;width:100%;height:40px;transform-origin:top;transform:translateZ(4px) rotateX(90deg);background:#f6f4ef}
.cB{left:0;bottom:0;width:100%;height:40px;transform-origin:bottom;transform:translateZ(4px) rotateX(-90deg);background:#d8d4cc}
</style></head><body>
<div class="wrap"><div class="shadow"></div>
 <div class="fr"><div class="back"></div><div class="side sR"></div><div class="side sL"></div><div class="side sT"></div><div class="side sB"></div>
  <div class="cv"><div class="cs cR"></div><div class="cs cL"></div><div class="cs cT"></div><div class="cs cB"></div><div class="face"></div></div>
  <div class="ring"></div></div>
</div><div class="sun"></div>
</body></html>
