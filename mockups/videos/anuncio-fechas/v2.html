<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:SG;src:url(space-grotesk-latin.woff2);font-weight:300 700}
*{margin:0;box-sizing:border-box}
body{width:540px;height:960px;overflow:hidden;background:radial-gradient(120% 80% at 50% 40%,#f6f1ea 0%,#e9dfd1 70%,#dccfbd 100%);font-family:Inter,sans-serif;position:relative;perspective:1400px}
.top{position:absolute;top:60px;left:0;right:0;text-align:center}
.bf{display:inline-block;background:#0a0a0a;color:#fff;font-weight:900;letter-spacing:.14em;font-size:22px;padding:8px 18px;border-radius:6px}
.h{font-family:Fraunces,serif;font-weight:800;font-size:34px;line-height:1.08;margin-top:14px;color:#141414;padding:0 30px}
.cal{position:absolute;left:50%;top:250px;width:260px;margin-left:-130px;height:92px;border-radius:16px;background:#fff;box-shadow:0 14px 28px -14px rgba(0,0,0,.35);overflow:hidden}
.cal:before{content:"";position:absolute;top:0;left:0;right:0;height:22px;background:#A8322A}
.cal .ring{position:absolute;top:-6px;width:10px;height:22px;border-radius:6px;background:#3a3a3a}
.cal .w{position:absolute;top:22px;left:0;right:0;height:70px}
.cal .it{position:absolute;left:0;right:0;height:70px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:26px;color:#141414}
.stage{position:absolute;left:50%;top:640px;transform-style:preserve-3d}
.box{position:absolute;left:-150px;top:-30px;width:300px;height:170px;background:linear-gradient(#1a1a1a,#0c0c0c);border-radius:6px;box-shadow:0 30px 40px -18px rgba(0,0,0,.5)}
.box:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:34px;margin-left:-17px;background:#A8322A}
.lid{position:absolute;left:-162px;top:-62px;width:324px;height:46px;background:#141414;border-radius:6px;transform-origin:0 100%;box-shadow:0 10px 20px -10px rgba(0,0,0,.5)}
.lid:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:34px;margin-left:-17px;background:#A8322A}
.lid .bw{position:absolute;left:50%;top:-58px;font-size:70px;transform:translateX(-50%)}
.clip{position:absolute;left:-170px;top:-430px;width:340px;height:400px;overflow:hidden}
.canvas{position:absolute;left:45px;top:70px;width:250px;height:312px;background:url(obra.jpg) center/cover;box-shadow:0 30px 44px -18px rgba(0,0,0,.5)}
.txt2{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:Fraunces,serif;font-weight:800;font-size:30px;color:#141414;opacity:0}
.chip{position:absolute;left:0;right:0;top:812px;text-align:center}
.chip .p{display:inline-flex;align-items:baseline;gap:10px;background:#fff;border-radius:999px;padding:11px 20px;box-shadow:0 10px 24px -10px rgba(0,0,0,.3);font-weight:900;font-size:22px;color:#141414}
.chip .p small{font-weight:500;font-size:13px;color:#5b534a}
.chip .p s{font-weight:500;font-size:15px;color:#9a8f83}
.chip .g{margin-top:9px;font-size:12.5px;font-weight:700;color:#A8322A}
.logo{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:SG;font-weight:700;font-size:24px;letter-spacing:.08em;color:#0a0a0a}
</style></head><body>
<div class="top"><span class="bf" id="bf">BLACK FRIDAY</span><div class="h" id="h">El regalo perfecto para alguien que ama a su mascota.</div></div>
<div class="cal" id="cal"><span class="ring" style="left:60px"></span><span class="ring" style="right:60px"></span><div class="w" id="w"></div></div>
<div class="txt2" id="t2">…y a la primera. 🎯</div>
<div class="stage" id="st">
 <div class="clip"><div class="canvas" id="cv"></div></div>
 <div class="box"></div>
 <div class="lid" id="lid"><span class="bw">🎀</span></div>
</div>
<div class="chip" id="chip"><div class="p"><small>Lienzo desde</small>29,95 €<s>39,95 €</s></div><div class="g">🎁 + lámina A4 de regalo desde 60 € · hasta el 30 nov</div></div>
<div class="logo">arsnoir</div>
<script>
const items=['🎂 Cumpleaños','❤️ Aniversario','👑 Reyes','🐶 Su cumple','🎄 Navidad'];
const W=document.getElementById('w');items.forEach((s,i)=>{const d=document.createElement('div');d.className='it';d.textContent=s;d.style.top=(i*70)+'px';W.appendChild(d)});
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),e=t=>1-Math.pow(1-t,3),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};const seg=(t,a,b)=>cl((t-a)/(b-a),0,1);
window.render=function(t){
 ['bf','h'].forEach((id,i)=>{const k=e(seg(t,.1*i,.5+.1*i));const el=document.getElementById(id);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*16}px)`});
 const ci=e(seg(t,.3,.7));const cal=document.getElementById('cal');cal.style.opacity=ci;cal.style.transform=`scale(${.9+.1*ci})`;
 // date roll: step each ~0.55s from 0.8 to 3.0, ease into each
 let pos=0;const steps=[0.8,1.35,1.9,2.45];steps.forEach(s=>{pos+=eio(seg(t,s,s+.35))});
 W.style.transform=`translateY(${-pos*70}px)`;
 const land=back(seg(t,2.8,3.1));cal.style.transform=`scale(${(.9+.1*ci)*(t>2.8?1+.06*Math.sin(Math.PI*seg(t,2.8,3.2)):1)})`;
 // box enters
 const bi=back(seg(t,.4,1));const st=document.getElementById('st');st.style.transform=`translateY(${(1-bi)*260}px)`;
 // lid opens 3.2-3.8
 const lo=eio(seg(t,3.2,3.8));const lid=document.getElementById('lid');lid.style.transform=`rotate(${-lo*110}deg) translate(${-lo*30}px,${-lo*20}px)`;lid.style.opacity=1-seg(t,3.6,3.9);
 // canvas rises 3.5-4.5
 const cr=back(seg(t,3.5,4.5));const cv=document.getElementById('cv');cv.style.opacity=t<3.5?0:1;
 document.getElementById('cal').style.opacity=1-seg(t,3.7,4.2);
 cv.style.transform=`translateY(${(1-cr)*330}px) rotate(${(1-cr)*-6+Math.sin(Math.max(0,t-4.5)*1.2)*1.5}deg) scale(${.8+.2*cr+seg(t,4.5,8)*.05})`;
 const c=e(seg(t,4.6,5.2));const ch=document.getElementById('chip');ch.style.opacity=c;ch.style.transform=`translateY(${(1-c)*20}px)`;
};
render(0);
</script></body></html>
